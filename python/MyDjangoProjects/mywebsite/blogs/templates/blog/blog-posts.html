<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{blog_name|title}}</title>
</head>
<body>
    <ul>
        {% for b in blog %} 
            <li><a href = "{% url 'blog-posts' blog=b %}">{{b|capfirst}}</a></li> 
        {% endfor %}
    </ul>
</body>
</html>
{% comment %}
This file is creating the url of your blogs, line no. 11 is
the main function or content to make the link of the url.
We have also use the special Django Template Lnaguage(for loop)-> in line no.10.
{% endcomment %}
